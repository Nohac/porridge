[package]
name = "benches"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bowl = { path = "../bowl" }
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
criterion = "0.5"
bump-scope = "2.4.1"
dhat = "0.3.3"

[[bench]]
name = "engine"
harness = false

[[bench]]
name = "stateful"
harness = false

[[bench]]
name = "dispatch"
harness = false

[[bench]]
name = "command_buffers"
harness = false
